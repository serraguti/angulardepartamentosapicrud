<p>home-departamentos-component works!</p>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Localidad</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (dept of arraydepartamentos; track dept){
            <tr>
                <td>{{dept.idDepartamento}}</td>
                <td>{{dept.nombre}}</td>
                <td>{{dept.localidad}}</td>
                <td>
                    <a [routerLink]="['/deleteruta', dept.idDepartamento]"
                    class="btn btn-danger">
                        Delete
                    </a>
                    <a [routerLink]="['/update', dept.idDepartamento]"
                    class="btn btn-info">
                        Edit
                    </a>
                </td>
            </tr>
        }
    </tbody>
</table>
