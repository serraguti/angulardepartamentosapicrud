<p>home-departamentos-component works!</p>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Localidad</th>
        </tr>
    </thead>
    <tbody>
        @for (dept of arraydepartamentos; track dept){
            <tr>
                <td>{{dept.idDepartamento}}</td>
                <td>{{dept.nombre}}</td>
                <td>{{dept.localidad}}</td>
            </tr>
        }
    </tbody>
</table>
